kind = "web"
previewPath = "/mt-core-labs/"
title = "MT Core Labs"
description = "A lightweight company and app portfolio for MT Core Labs, showcasing Android apps, publisher information, developer profile, news, and support with an InfinityFree-ready static build."
version = "1.0.0"
id = "artifacts/mt-core-labs"
router = "path"

[[services]]
name = "web"
paths = [ "/mt-core-labs/" ]
localPort = 22507

[services.development]
run = "pnpm --filter @workspace/mt-core-labs run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mt-core-labs", "run", "build" ]
serve = "static"
publicDir = "artifacts/mt-core-labs/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22507"
BASE_PATH = "/mt-core-labs/"
